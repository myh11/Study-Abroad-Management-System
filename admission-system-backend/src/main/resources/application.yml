server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: admission-system-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:admission_system}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mYh031005}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: info

app:
  jwt:
    secret: admission-system-dev-jwt-secret-change-me-2026
    expiration-seconds: 7200
  security:
    login-fail-threshold: 5
    lock-minutes: 30
  file:
    base-dir: ./storage/files
  waitlist:
    timeout-scan-ms: 60000
    batch-close-scan-ms: 300000
