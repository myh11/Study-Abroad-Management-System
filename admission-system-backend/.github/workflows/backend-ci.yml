name: backend-ci

on:
  push:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SERVER_PORT: 8080
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: admission_system
      DB_USERNAME: root
      DB_PASSWORD: mYh031005
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: mvn -q -DskipTests compile

      - name: Run tests
        run: mvn -q test
